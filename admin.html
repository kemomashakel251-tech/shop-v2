<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة التحكم — متجري</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app-root">
  <p class="empty" style="padding:80px 20px;">جارِ التحميل...</p>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
  let auth = null;
  if (IS_CONFIGURED) auth = firebase.auth();

  let currentTab = "stats";
  let products = [];
  let orders = [];
  let coupons = [];

  function renderLogin(errorMsg) {
    document.getElementById("app-root").innerHTML = `
      <div class="admin-login">
        <h2 style="margin-top:0;">تسجيل دخول الأدمن</h2>
        ${errorMsg ? `<p style="color:#c0392b; font-size:14px;">${errorMsg}</p>` : ""}
        <form id="login-form">
          <div class="field"><label>البريد الإلكتروني</label><input type="email" name="email" required /></div>
          <div class="field"><label>كلمة المرور</label><input type="password" name="password" required /></div>
          <button type="submit" class="btn btn-primary">دخول</button>
        </form>
      </div>
    `;
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      try { await auth.signInWithEmailAndPassword(f.email.value, f.password.value); }
      catch (err) { renderLogin("بيانات الدخول غير صحيحة، أو لسه معملتش يوزر أدمن (راجع README.md)."); }
    });
  }

  const TABS = [
    { id: "stats", label: "الإحصائيات" },
    { id: "products", label: "المنتجات" },
    { id: "orders", label: "الطلبات" },
    { id: "coupons", label: "الكوبونات" },
    { id: "shipping", label: "الشحن" },
    { id: "faq", label: "الأسئلة الشائعة" },
    { id: "settings", label: "الإعدادات" }
  ];

  function renderShell() {
    document.getElementById("app-root").innerHTML = `
      <div class="admin-shell">
        <aside class="admin-sidebar">
          <span class="logo">لوحة التحكم</span>
          ${TABS.map((t) => `<a href="#" data-tab="${t.id}" class="tab-link">${t.label}</a>`).join("")}
          <a href="#" id="logout-link">تسجيل الخروج</a>
        </aside>
        <main class="admin-main" id="admin-main"></main>
      </div>
    `;
    document.querySelectorAll(".tab-link[data-tab]").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        currentTab = a.dataset.tab;
        renderTabs();
        renderCurrentTab();
      });
    });
    document.getElementById("logout-link").addEventListener("click", (e) => { e.preventDefault(); auth.signOut(); });
    renderTabs();
    renderCurrentTab();
  }

  function renderTabs() {
    document.querySelectorAll(".tab-link[data-tab]").forEach((a) => a.classList.toggle("active", a.dataset.tab === currentTab));
  }

  function renderCurrentTab() {
    if (currentTab === "stats") loadStats();
    else if (currentTab === "products") loadProducts();
    else if (currentTab === "orders") loadOrders();
    else if (currentTab === "coupons") loadCoupons();
    else if (currentTab === "shipping") loadShipping();
    else if (currentTab === "faq") loadFaq();
    else loadSettings();
  }

  function showAdminError(e) {
    const main = document.getElementById("admin-main");
    console.error(e);
    main.innerHTML = `
      <div class="empty" style="text-align:right; background:#fdeceb; border-radius:10px; padding:16px;">
        <p style="color:#c0392b; font-weight:700; margin:0 0 6px;">حصل خطأ أثناء تحميل البيانات</p>
        <p style="margin:0; font-size:13px; color:#7a2b21;">${(e && e.message) || e}</p>
        <p style="margin:10px 0 0; font-size:13px;">
          لو الخطأ فيه "permission-denied" يبقى قواعد Firestore (Rules) لسه مش منشورة صح — راجع خطوة 4 في README.md.<br>
          افتح Developer Console (F12) لتفاصيل أكتر.
        </p>
      </div>
    `;
  }

  /* ================= الإحصائيات ================= */
  async function loadStats() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `<p class="empty">جارِ التحميل...</p>`;
    try {
    const [ordersSnap, productsSnap] = await Promise.all([
      db.collection("orders").get(),
      db.collection("products").get()
    ]);
    const allOrders = ordersSnap.docs.map((d) => d.data());
    const validOrders = allOrders.filter((o) => o.status !== "ملغي");
    const revenue = validOrders.reduce((s, o) => s + (o.total || 0), 0);
    const byStatus = {};
    allOrders.forEach((o) => { byStatus[o.status] = (byStatus[o.status] || 0) + 1; });

    const soldQty = {};
    validOrders.forEach((o) => {
      (o.items || []).forEach((i) => { soldQty[i.name] = (soldQty[i.name] || 0) + i.qty; });
    });
    const topProducts = Object.entries(soldQty).sort((a, b) => b[1] - a[1]).slice(0, 5);

    /* ---- حساب المخزون ---- */
    const allProducts = productsSnap.docs.map((d) => d.data());
    let totalStock = 0;
    let outOfStockCount = 0;
    const lowStockList = [];
    allProducts.forEach((p) => {
      const variantEntries = [
        ...Object.entries(p.colorsStock || {}),
        ...Object.entries(p.sizesStock || {})
      ];
      if (variantEntries.length) {
        variantEntries.forEach(([label, qty]) => {
          totalStock += qty || 0;
          if ((qty || 0) <= 0) outOfStockCount++;
          else if (qty <= 5) lowStockList.push(`${p.name} — ${label} (${qty})`);
        });
      } else if (p.stock != null) {
        totalStock += p.stock || 0;
        if ((p.stock || 0) <= 0) outOfStockCount++;
        else if (p.stock <= 5) lowStockList.push(`${p.name} (${p.stock})`);
      }
    });

    main.innerHTML = `
      <h2 style="margin-top:0;">الإحصائيات</h2>
      <div class="stats-grid">
        <div class="stat-card"><span class="stat-num">${formatPrice(revenue)}</span><span class="stat-label">إجمالي المبيعات</span></div>
        <div class="stat-card"><span class="stat-num">${allOrders.length}</span><span class="stat-label">عدد الطلبات</span></div>
        <div class="stat-card"><span class="stat-num">${productsSnap.size}</span><span class="stat-label">عدد المنتجات</span></div>
        <div class="stat-card"><span class="stat-num">${allOrders.length ? Math.round(revenue / Math.max(1, validOrders.length)) : 0} ج.م</span><span class="stat-label">متوسط قيمة الطلب</span></div>
        <div class="stat-card"><span class="stat-num">${totalStock}</span><span class="stat-label">إجمالي قطع المخزون</span></div>
        <div class="stat-card"><span class="stat-num" style="color:#c0392b;">${outOfStockCount}</span><span class="stat-label">خيارات نفذت من المخزون</span></div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;">
        <div class="panel">
          <h2>الطلبات حسب الحالة</h2>
          ${Object.entries(byStatus).map(([s, c]) => `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);"><span>${s}</span><strong>${c}</strong></div>`).join("") || "<p class='empty'>لا توجد بيانات</p>"}
        </div>
        <div class="panel">
          <h2>الأكثر مبيعًا</h2>
          ${topProducts.map(([name, qty]) => `<div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border);"><span>${name}</span><strong>${qty}</strong></div>`).join("") || "<p class='empty'>لا توجد بيانات بعد</p>"}
        </div>
      </div>
      <div class="panel" style="margin-top:20px;">
        <h2>كميات قاربت على النفاذ (5 قطع أو أقل)</h2>
        ${lowStockList.length ? lowStockList.map((l) => `<div style="padding:6px 0; border-bottom:1px solid var(--border); font-size:14px;">${l}</div>`).join("") : "<p class='empty'>لا يوجد حاليًا</p>"}
      </div>
    `;
    } catch (e) { showAdminError(e); }
  }

  /* ================= المنتجات ================= */
  async function loadProducts() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `<p class="empty">جارِ التحميل...</p>`;
    try {
    const snap = await db.collection("products").orderBy("createdAt", "desc").get();
    products = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderProductsTable();
    } catch (e) { showAdminError(e); }
  }

  function renderProductsTable() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <h2 style="margin:0;">المنتجات (${products.length})</h2>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" style="width:auto; padding:10px 18px;" id="add-product-btn">+ إضافة منتج</button>
          <button class="btn btn-outline" style="width:auto; padding:10px 18px;" id="add-book-btn">📄 + إضافة كتاب PDF</button>
        </div>
      </div>
      ${
        products.length === 0 ? `<p class="empty">لا توجد منتجات بعد.</p>` :
        `<table class="table">
          <thead><tr><th>الصورة</th><th>الاسم</th><th>القسم</th><th>السعر</th><th></th></tr></thead>
          <tbody>
            ${products.map((p) => `
              <tr>
                <td><img src="${(p.images && p.images[0]) || ''}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--brand-light);" onerror="this.style.visibility='hidden'" /></td>
                <td>${p.name}</td>
                <td>${p.category || "-"}</td>
                <td>${formatPrice(p.price)}</td>
                <td>
                  <button class="icon-btn" onclick="editProduct('${p.id}')">تعديل</button>
                  <button class="icon-btn" style="color:#c0392b;" onclick="deleteProduct('${p.id}')">حذف</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>`
      }
    `;
    document.getElementById("add-product-btn").onclick = () => openProductModal(null);
    document.getElementById("add-book-btn").onclick = () => openProductModal(null);
  }

  let modalImages = [];
  let modalVideo = "";
  let modalPdf = "";
  let modalColors = []; /* [{name, stock}] */
  let modalSizes = [];  /* [{name, stock}] */

  function openProductModal(product) {
    modalImages = (product && product.images) ? [...product.images] : (product && product.image ? [product.image] : []);
    modalVideo = (product && product.video) || "";
    modalPdf = (product && product.pdfUrl) || "";
    modalColors = (product && product.colors) ? product.colors.map((c) => ({ name: c, stock: (product.colorsStock && product.colorsStock[c]) ?? 0 })) : [];
    modalSizes = (product && product.sizes) ? product.sizes.map((s) => ({ name: s, stock: (product.sizesStock && product.sizesStock[s]) ?? 0 })) : [];

    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h2 style="margin-top:0;">${product ? "تعديل المنتج" : "إضافة منتج جديد"}</h2>
        ${!CLOUDINARY_CONFIGURED ? `<p style="background:#fff3cd; color:#7a5c00; padding:8px 12px; border-radius:8px; font-size:13px;">⚠️ لسه معملتش ربط Cloudinary — راجع README.md</p>` : ""}
        <form id="product-form">
          <div class="field"><label>اسم المنتج</label><input name="name" required value="${product?.name || ""}" /></div>
          <div class="field"><label>القسم</label><input name="category" value="${product?.category || ""}" /></div>
          <div class="field"><label>السعر</label><input name="price" type="number" step="0.01" required value="${product?.price ?? ""}" /></div>
          <div class="field"><label>السعر قبل الخصم (اختياري)</label><input name="oldPrice" type="number" step="0.01" value="${product?.oldPrice ?? ""}" /></div>

          <div class="field">
            <label>المخزون الإجمالي (استخدمه لو المنتج من غير خيارات لون/مقاس — لو المنتج له ألوان أو مقاسات، حدد مخزون كل خيار لوحده تحت)</label>
            <input name="stock" type="number" min="0" placeholder="مثلاً 50" value="${product?.stock ?? ""}" />
          </div>

          <div class="field">
            <label>أقصى كمية يطلبها العميل الواحد (اختياري)</label>
            <input name="maxQtyPerOrder" type="number" min="1" placeholder="مثلاً 3 — سيبه فاضي لو مفيش حد أقصى" value="${product?.maxQtyPerOrder || ""}" />
          </div>

          <div class="field">
            <label>خيارات المنتج 1 — مثال: لون، نوع، سعة (اختياري، ولو مش محتاجه سيبه فاضي)</label>
            <div class="tag-builder-row">
              <input type="text" id="color-name-input" placeholder="اكتب اسم الخيار، مثال: أبيض" />
              <input type="number" id="color-stock-input" class="stock-input" placeholder="الكمية" min="0" />
              <button type="button" class="btn btn-outline" style="width:auto; padding:8px 16px;" id="add-color-btn">➕ إضافة</button>
            </div>
            <div class="tag-list" id="color-tag-list"></div>
          </div>

          <div class="field">
            <label>خيارات المنتج 2 — مثال: مقاس، حجم (اختياري)</label>
            <div class="tag-builder-row">
              <input type="text" id="size-name-input" placeholder="اكتب اسم الخيار، مثال: لارج" />
              <input type="number" id="size-stock-input" class="stock-input" placeholder="الكمية" min="0" />
              <button type="button" class="btn btn-outline" style="width:auto; padding:8px 16px;" id="add-size-btn">➕ إضافة</button>
            </div>
            <div class="tag-list" id="size-tag-list"></div>
          </div>

          <div class="field">
            <label>خصم الكمية (اختياري)</label>
            <div style="display:flex; gap:10px;">
              <input name="qtyDiscountThreshold" type="number" min="2" placeholder="اشترِ كذا قطعة" value="${product?.qtyDiscountThreshold || ""}" />
              <input name="qtyDiscountPercent" type="number" min="1" max="90" placeholder="نسبة الخصم %" value="${product?.qtyDiscountPercent || ""}" />
            </div>
          </div>

          <div class="field">
            <label>صور المنتج</label>
            <input type="file" id="image-input" accept="image/*" multiple />
            <div id="image-progress"></div>
            <div id="image-preview-list" class="media-preview-list"></div>
          </div>
          <div class="field">
            <label>فيديو المنتج (اختياري)</label>
            <input type="file" id="video-input" accept="video/*" />
            <div id="video-progress"></div>
            <div id="video-preview-box" class="media-preview-list"></div>
          </div>

          <div class="field">
            <label>📄 ملف كتاب PDF (اختياري — لو المنتج ده كتاب/ملف رقمي)</label>
            <input type="file" id="pdf-input" accept="application/pdf" />
            <div id="pdf-progress"></div>
            <div id="pdf-preview-box" style="margin-top:8px;"></div>
          </div>

          <div class="field"><label>الوصف</label><textarea name="description">${product?.description || ""}</textarea></div>
          <div style="display:flex; gap:10px;">
            <button type="button" class="btn btn-outline" id="cancel-modal">إلغاء</button>
            <button type="submit" class="btn btn-primary">حفظ</button>
          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector("#cancel-modal").onclick = () => overlay.remove();
    renderImagePreviews(overlay);
    renderVideoPreview(overlay);
    renderPdfPreview(overlay);
    renderTagList(overlay, "color");
    renderTagList(overlay, "size");

    overlay.querySelector("#add-color-btn").addEventListener("click", () => addTag(overlay, "color"));
    overlay.querySelector("#add-size-btn").addEventListener("click", () => addTag(overlay, "size"));

    overlay.querySelector("#image-input").addEventListener("change", async (e) => {
      const files = Array.from(e.target.files);
      const progressBox = overlay.querySelector("#image-progress");
      for (const file of files) {
        progressBox.textContent = `جارِ رفع ${file.name}...`;
        try {
          const res = await uploadToCloudinary(file, (pct) => { progressBox.textContent = `جارِ رفع ${file.name}... ${pct}%`; });
          modalImages.push(res.url);
          renderImagePreviews(overlay);
        } catch (err) { alert("فشل رفع الصورة: " + err.message); }
      }
      progressBox.textContent = "";
      e.target.value = "";
    });

    overlay.querySelector("#video-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const progressBox = overlay.querySelector("#video-progress");
      progressBox.textContent = `جارِ رفع الفيديو...`;
      try {
        const res = await uploadToCloudinary(file, (pct) => { progressBox.textContent = `جارِ رفع الفيديو... ${pct}%`; });
        modalVideo = res.url;
        renderVideoPreview(overlay);
      } catch (err) { alert("فشل رفع الفيديو: " + err.message); }
      progressBox.textContent = "";
      e.target.value = "";
    });

    overlay.querySelector("#pdf-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const progressBox = overlay.querySelector("#pdf-progress");
      progressBox.textContent = `جارِ رفع الملف...`;
      try {
        const res = await uploadToCloudinary(file, (pct) => { progressBox.textContent = `جارِ رفع الملف... ${pct}%`; });
        modalPdf = res.url;
        renderPdfPreview(overlay);
      } catch (err) { alert("فشل رفع الملف: " + err.message); }
      progressBox.textContent = "";
      e.target.value = "";
    });

    overlay.querySelector("#product-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const colorsStock = {}; modalColors.forEach((c) => { colorsStock[c.name] = c.stock; });
      const sizesStock = {}; modalSizes.forEach((s) => { sizesStock[s.name] = s.stock; });
      const data = {
        name: f.name.value.trim(),
        category: f.category.value.trim(),
        price: parseFloat(f.price.value) || 0,
        oldPrice: f.oldPrice.value ? parseFloat(f.oldPrice.value) : null,
        stock: f.stock.value !== "" ? parseInt(f.stock.value) : null,
        maxQtyPerOrder: f.maxQtyPerOrder.value ? parseInt(f.maxQtyPerOrder.value) : null,
        colors: modalColors.map((c) => c.name),
        colorsStock: colorsStock,
        sizes: modalSizes.map((s) => s.name),
        sizesStock: sizesStock,
        qtyDiscountThreshold: f.qtyDiscountThreshold.value ? parseInt(f.qtyDiscountThreshold.value) : null,
        qtyDiscountPercent: f.qtyDiscountPercent.value ? parseFloat(f.qtyDiscountPercent.value) : null,
        images: modalImages,
        video: modalVideo,
        pdfUrl: modalPdf,
        description: f.description.value.trim()
      };
      if (product) await db.collection("products").doc(product.id).update(data);
      else { data.createdAt = firebase.firestore.FieldValue.serverTimestamp(); await db.collection("products").add(data); }
      clearProductsCache();
      overlay.remove();
      loadProducts();
    });
  }

  function addTag(overlay, kind) {
    const nameInput = overlay.querySelector(`#${kind}-name-input`);
    const stockInput = overlay.querySelector(`#${kind}-stock-input`);
    const name = nameInput.value.trim();
    if (!name) return;
    const stock = stockInput.value !== "" ? parseInt(stockInput.value) : 0;
    const list = kind === "color" ? modalColors : modalSizes;
    const existing = list.find((t) => t.name === name);
    if (existing) existing.stock = stock;
    else list.push({ name, stock });
    nameInput.value = "";
    stockInput.value = "";
    nameInput.focus();
    renderTagList(overlay, kind);
  }
  function renderTagList(overlay, kind) {
    const list = kind === "color" ? modalColors : modalSizes;
    const box = overlay.querySelector(`#${kind}-tag-list`);
    box.innerHTML = list.map((t, idx) => `
      <span class="tag-chip">${t.name} (${t.stock}) <button type="button" onclick="removeTag('${kind}', ${idx})">×</button></span>
    `).join("") || `<span style="color:var(--text-muted); font-size:13px;">لسه مفيش خيارات مضافة</span>`;
    window.__adminOverlay = overlay;
  }
  window.removeTag = (kind, idx) => {
    const list = kind === "color" ? modalColors : modalSizes;
    list.splice(idx, 1);
    renderTagList(window.__adminOverlay, kind);
  };

  function renderImagePreviews(overlay) {
    const box = overlay.querySelector("#image-preview-list");
    box.innerHTML = modalImages.map((url, idx) => `
      <div class="media-thumb"><img src="${url}" /><button type="button" class="media-remove" onclick="removeModalImage(${idx})">×</button></div>
    `).join("");
    window.__adminOverlay = overlay;
  }
  function renderVideoPreview(overlay) {
    const box = overlay.querySelector("#video-preview-box");
    box.innerHTML = modalVideo ? `<div class="media-thumb"><video src="${modalVideo}" muted></video><button type="button" class="media-remove" onclick="removeModalVideo()">×</button></div>` : "";
  }
  function renderPdfPreview(overlay) {
    const box = overlay.querySelector("#pdf-preview-box");
    box.innerHTML = modalPdf
      ? `<div style="display:flex; align-items:center; gap:10px; background:var(--brand-light); padding:8px 12px; border-radius:8px; font-size:13px;">
           📄 <a href="${modalPdf}" target="_blank" style="color:var(--brand-dark); font-weight:700;">معاينة الملف المرفوع</a>
           <button type="button" class="media-remove" style="position:static;" onclick="removeModalPdf()">×</button>
         </div>`
      : "";
  }
  window.removeModalImage = (idx) => { modalImages.splice(idx, 1); renderImagePreviews(window.__adminOverlay); };
  window.removeModalVideo = () => { modalVideo = ""; renderVideoPreview(window.__adminOverlay); };
  window.removeModalPdf = () => { modalPdf = ""; renderPdfPreview(window.__adminOverlay); };
  window.editProduct = (id) => openProductModal(products.find((p) => p.id === id));
  window.deleteProduct = async (id) => {
    if (!confirm("متأكد إنك عايز تحذف المنتج ده؟")) return;
    await db.collection("products").doc(id).delete();
    clearProductsCache();
    loadProducts();
  };

  /* ================= الطلبات ================= */
  const STATUSES = ["جديد", "قيد التجهيز", "تم الشحن", "تم التسليم", "ملغي"];

  async function loadOrders() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `<p class="empty">جارِ التحميل...</p>`;
    try {
    const snap = await db.collection("orders").orderBy("createdAt", "desc").get();
    orders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderOrdersTable();
    } catch (e) { showAdminError(e); }
  }

  function renderOrdersTable() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `
      <h2 style="margin-top:0;">الطلبات (${orders.length})</h2>
      ${
        orders.length === 0 ? `<p class="empty">لا توجد طلبات بعد.</p>` :
        `<table class="table">
          <thead><tr><th>العميل</th><th>الموبايل</th><th>الدفع</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead>
          <tbody>
            ${orders.map((o) => `
              <tr>
                <td>${o.customerName}</td>
                <td>${o.phone}</td>
                <td>${o.paymentMethod || "الدفع عند الاستلام"}</td>
                <td>${formatPrice(o.total)}</td>
                <td>
                  <select onchange="updateStatus('${o.id}', this.value)">
                    ${STATUSES.map((s) => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
                  </select>
                </td>
                <td><button class="icon-btn" onclick="viewOrder('${o.id}')">تفاصيل</button></td>
              </tr>`).join("")}
          </tbody>
        </table>`
      }
    `;
  }

  window.updateStatus = async (id, status) => {
    await db.collection("orders").doc(id).update({ status });
    const o = orders.find((x) => x.id === id);
    if (o) o.status = status;
  };

  window.viewOrder = (id) => {
    const o = orders.find((x) => x.id === id);
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h2 style="margin-top:0;">تفاصيل الطلب</h2>
        <p><strong>العميل:</strong> ${o.customerName}</p>
        <p><strong>الموبايل:</strong> ${o.phone}</p>
        <p><strong>المحافظة:</strong> ${o.city}</p>
        <p><strong>العنوان:</strong> ${o.address}</p>
        <p><strong>طريقة الدفع:</strong> ${o.paymentMethod || "الدفع عند الاستلام"}</p>
        ${o.couponCode ? `<p><strong>الكوبون:</strong> ${o.couponCode}</p>` : ""}
        ${o.notes ? `<p><strong>ملاحظات:</strong> ${o.notes}</p>` : ""}
        <hr style="border-color: var(--border); margin: 16px 0;" />
        ${(o.items || []).map((i) => `<div class="cart-line"><div class="cart-line-info"><p class="cart-line-name">${i.name}${[i.color,i.size].filter(Boolean).length ? ` (${[i.color,i.size].filter(Boolean).join(' / ')})` : ''}</p><p class="cart-line-qty">${formatPrice(i.price)} × ${i.qty}</p></div></div>`).join("")}
        ${o.discount ? `<div class="total-row" style="font-size:14px; border-top:none; padding-top:0; color:#c0392b;"><span>الخصم</span><span>-${formatPrice(o.discount)}</span></div>` : ""}
        <div class="total-row" style="font-size:15px; font-weight:700; border-top:none; padding-top:0;"><span>الشحن</span><span>${formatPrice(o.shipping || 0)}</span></div>
        <div class="total-row"><span>الإجمالي</span><span>${formatPrice(o.total)}</span></div>
        <button class="btn btn-outline" id="close-modal">إغلاق</button>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector("#close-modal").onclick = () => overlay.remove();
  };

  /* ================= الكوبونات ================= */
  async function loadCoupons() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `<p class="empty">جارِ التحميل...</p>`;
    try {
    const snap = await db.collection("coupons").get();
    coupons = snap.docs.map((d) => ({ code: d.id, ...d.data() }));
    renderCouponsTable();
    } catch (e) { showAdminError(e); }
  }

  function renderCouponsTable() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">
        <h2 style="margin:0;">الكوبونات (${coupons.length})</h2>
        <button class="btn btn-primary" style="width:auto; padding:10px 18px;" id="add-coupon-btn">+ كوبون جديد</button>
      </div>
      ${
        coupons.length === 0 ? `<p class="empty">لا توجد كوبونات بعد.</p>` :
        `<table class="table">
          <thead><tr><th>الكود</th><th>النوع</th><th>القيمة</th><th>الحالة</th><th></th></tr></thead>
          <tbody>
            ${coupons.map((c) => `
              <tr>
                <td>${c.code}</td>
                <td>${c.type === "percent" ? "نسبة %" : "مبلغ ثابت"}</td>
                <td>${c.type === "percent" ? c.value + "%" : formatPrice(c.value)}</td>
                <td><span class="status-badge">${c.active ? "مفعّل" : "متوقف"}</span></td>
                <td><button class="icon-btn" style="color:#c0392b;" onclick="deleteCoupon('${c.code}')">حذف</button></td>
              </tr>`).join("")}
          </tbody>
        </table>`
      }
    `;
    document.getElementById("add-coupon-btn").onclick = openCouponModal;
  }

  function openCouponModal() {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <h2 style="margin-top:0;">كوبون جديد</h2>
        <form id="coupon-form">
          <div class="field"><label>الكود</label><input name="code" required placeholder="مثال: SALE20" style="text-transform:uppercase;" /></div>
          <div class="field">
            <label>النوع</label>
            <select name="type"><option value="percent">نسبة مئوية %</option><option value="fixed">مبلغ ثابت</option></select>
          </div>
          <div class="field"><label>القيمة</label><input name="value" type="number" required /></div>
          <div class="field"><label>الحد الأدنى للطلب (اختياري)</label><input name="minOrder" type="number" /></div>
          <div style="display:flex; gap:10px;">
            <button type="button" class="btn btn-outline" id="cancel-modal">إلغاء</button>
            <button type="submit" class="btn btn-primary">حفظ</button>
          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector("#cancel-modal").onclick = () => overlay.remove();
    overlay.querySelector("#coupon-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const code = f.code.value.trim().toUpperCase();
      await db.collection("coupons").doc(code).set({
        type: f.type.value,
        value: parseFloat(f.value.value) || 0,
        minOrder: f.minOrder.value ? parseFloat(f.minOrder.value) : null,
        active: true
      });
      overlay.remove();
      loadCoupons();
    });
  }

  window.deleteCoupon = async (code) => {
    if (!confirm("متأكد إنك عايز تحذف الكوبون ده؟")) return;
    await db.collection("coupons").doc(code).delete();
    loadCoupons();
  };

  /* ================= الشحن ================= */
  async function loadShipping() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `<p class="empty">جارِ التحميل...</p>`;
    try {
    const doc = await db.collection("settings").doc("shipping").get();
    renderShippingForm(doc.exists ? doc.data() : { cities: {}, default: 0 });
    } catch (e) { showAdminError(e); }
  }

  function renderShippingForm(data) {
    const main = document.getElementById("admin-main");
    const rows = Object.entries(data.cities || {});
    main.innerHTML = `
      <h2 style="margin-top:0;">إعدادات الشحن</h2>
      <div class="panel" style="max-width:520px;">
        <div class="field"><label>سعر الشحن الافتراضي</label><input id="default-shipping" type="number" step="0.01" value="${data.default || 0}" /></div>
        <div id="city-rows">${rows.map(([city, fee], idx) => cityRowHtml(city, fee, idx)).join("")}</div>
        <button type="button" class="btn btn-outline" id="add-city-row" style="margin-bottom:16px;">+ إضافة محافظة</button>
        <button type="button" class="btn btn-primary" id="save-shipping-btn">حفظ إعدادات الشحن</button>
      </div>
    `;
    let counter = rows.length;
    document.getElementById("add-city-row").onclick = () => {
      document.getElementById("city-rows").insertAdjacentHTML("beforeend", cityRowHtml("", "", counter++));
    };
    document.getElementById("save-shipping-btn").onclick = async () => {
      const cities = {};
      document.querySelectorAll(".city-row").forEach((row) => {
        const name = row.querySelector(".city-name").value.trim();
        const fee = parseFloat(row.querySelector(".city-fee").value) || 0;
        if (name) cities[name] = fee;
      });
      await db.collection("settings").doc("shipping").set({ default: parseFloat(document.getElementById("default-shipping").value) || 0, cities });
      alert("تم حفظ إعدادات الشحن");
    };
  }

  function cityRowHtml(city, fee, idx) {
    return `
      <div class="city-row" data-idx="${idx}" style="display:flex; gap:8px; margin-bottom:10px;">
        <input class="city-name" placeholder="اسم المحافظة" value="${city}" style="flex:1; padding:10px; border-radius:8px; border:1px solid var(--border);" />
        <input class="city-fee" type="number" step="0.01" placeholder="السعر" value="${fee}" style="width:110px; padding:10px; border-radius:8px; border:1px solid var(--border);" />
        <button type="button" class="icon-btn" style="color:#c0392b;" onclick="this.parentElement.remove()">حذف</button>
      </div>
    `;
  }

  /* ================= الأسئلة الشائعة ================= */
  async function loadFaq() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `<p class="empty">جارِ التحميل...</p>`;
    try {
    const doc = await db.collection("settings").doc("faq").get();
    renderFaqForm((doc.exists ? doc.data().items : []) || []);
    } catch (e) { showAdminError(e); }
  }

  function renderFaqForm(items) {
    const main = document.getElementById("admin-main");
    main.innerHTML = `
      <h2 style="margin-top:0;">الأسئلة الشائعة (بديل روبوت الرد)</h2>
      <div class="panel" style="max-width:600px;">
        <p style="color:var(--text-muted); font-size:14px; margin-top:0;">هتظهر للعميل كنافذة أسئلة شائعة في كل صفحات الموقع.</p>
        <div id="faq-rows">${items.map((i, idx) => faqRowHtml(i.q, i.a, idx)).join("")}</div>
        <button type="button" class="btn btn-outline" id="add-faq-row" style="margin-bottom:16px;">+ إضافة سؤال</button>
        <button type="button" class="btn btn-primary" id="save-faq-btn">حفظ الأسئلة الشائعة</button>
      </div>
    `;
    let counter = items.length;
    document.getElementById("add-faq-row").onclick = () => {
      document.getElementById("faq-rows").insertAdjacentHTML("beforeend", faqRowHtml("", "", counter++));
    };
    document.getElementById("save-faq-btn").onclick = async () => {
      const newItems = [];
      document.querySelectorAll(".faq-row").forEach((row) => {
        const q = row.querySelector(".faq-q-input").value.trim();
        const a = row.querySelector(".faq-a-input").value.trim();
        if (q && a) newItems.push({ q, a });
      });
      await db.collection("settings").doc("faq").set({ items: newItems });
      alert("تم حفظ الأسئلة الشائعة");
    };
  }

  function faqRowHtml(q, a, idx) {
    return `
      <div class="faq-row" data-idx="${idx}" style="border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:10px;">
        <input class="faq-q-input" placeholder="السؤال" value="${q}" style="width:100%; padding:9px; border-radius:8px; border:1px solid var(--border); margin-bottom:8px;" />
        <textarea class="faq-a-input" placeholder="الإجابة" style="width:100%; padding:9px; border-radius:8px; border:1px solid var(--border); min-height:60px;">${a}</textarea>
        <button type="button" class="icon-btn" style="color:#c0392b;" onclick="this.parentElement.remove()">حذف السؤال</button>
      </div>
    `;
  }

  /* ================= الإعدادات ================= */
  async function loadSettings() {
    const main = document.getElementById("admin-main");
    main.innerHTML = `<p class="empty">جارِ التحميل...</p>`;
    try {
    const doc = await db.collection("settings").doc("general").get();
    renderSettingsForm(doc.exists ? doc.data() : {});
    } catch (e) { showAdminError(e); }
  }

  function renderSettingsForm(s) {
    const main = document.getElementById("admin-main");
    main.innerHTML = `
      <h2 style="margin-top:0;">الإعدادات المتقدمة</h2>

      <div class="panel" style="max-width:640px; margin-bottom:20px;">
        <h2>بيانات المتجر و SEO</h2>
        <div class="field"><label>اسم المتجر</label><input id="s-storeName" value="${s.storeName || ""}" /></div>
        <div class="field">
          <label>لوجو المتجر</label>
          <input type="file" id="s-logo-input" accept="image/*" />
          <div id="s-logo-progress" style="font-size:13px; color:var(--text-muted); margin-top:6px;"></div>
          <input type="hidden" id="s-logoUrl" value="${s.logoUrl || ""}" />
          <img id="s-logo-preview" class="logo-preview" src="${s.logoUrl || ""}" style="${s.logoUrl ? "" : "display:none;"}" />
        </div>
        <div class="field"><label>عنوان SEO (يظهر في جوجل)</label><input id="s-seoTitle" value="${s.seoTitle || ""}" /></div>
        <div class="field"><label>وصف SEO</label><textarea id="s-seoDescription">${s.seoDescription || ""}</textarea></div>
      </div>

      <div class="panel" style="max-width:640px; margin-bottom:20px;">
        <h2>مظهر الموقع</h2>
        <p style="color:var(--text-muted); font-size:13px; margin-top:0;">غيّر ألوان ونص الموقع من هنا مباشرة بدون أي تعديل في الكود.</p>
        <div style="display:flex; gap:16px;">
          <div class="field" style="flex:1;">
            <label>اللون الأساسي</label>
            <input id="s-primaryColor" type="color" value="${s.primaryColor || "#0f6b5c"}" style="height:44px; padding:4px;" />
          </div>
          <div class="field" style="flex:1;">
            <label>لون الأزرار (Accent)</label>
            <input id="s-accentColor" type="color" value="${s.accentColor || "#ff6b4a"}" style="height:44px; padding:4px;" />
          </div>
        </div>
        <div class="field"><label>عنوان البانر الرئيسي</label><input id="s-heroTitle" value="${s.heroTitle || ""}" /></div>
        <div class="field"><label>وصف البانر الرئيسي</label><input id="s-heroSubtitle" value="${s.heroSubtitle || ""}" /></div>
      </div>

      <div class="panel" style="max-width:640px; margin-bottom:20px;">
        <h2>من نحن وسياسة الشحن</h2>
        <div class="field"><label>نص "من نحن"</label><textarea id="s-aboutText" style="min-height:100px;">${s.aboutText || ""}</textarea></div>
        <div class="field"><label>نص "سياسة الشحن والاسترجاع"</label><textarea id="s-shippingPolicyText" style="min-height:100px;">${s.shippingPolicyText || ""}</textarea></div>
      </div>

      <div class="panel" style="max-width:640px; margin-bottom:20px;">
        <h2>التواصل الاجتماعي وواتساب</h2>
        <div class="field"><label>رقم واتساب المتجر (بصيغة دولية بدون +)</label><input id="s-whatsappNumber" value="${s.whatsappNumber || ""}" placeholder="201xxxxxxxxx" /></div>
        <div class="field" style="display:flex; align-items:center; gap:10px;">
          <input type="checkbox" id="s-secondaryPhoneEnabled" ${s.secondaryPhoneEnabled ? "checked" : ""} style="width:auto;" />
          <label style="margin:0;">إظهار خانة "رقم هاتف آخر (اختياري)" في صفحة تأكيد الطلب</label>
        </div>
        <div class="field"><label>رابط فيسبوك</label><input id="s-facebookUrl" value="${s.facebookUrl || ""}" /></div>
        <div class="field"><label>رابط إنستجرام</label><input id="s-instagramUrl" value="${s.instagramUrl || ""}" /></div>
        <div class="field"><label>رابط تيك توك</label><input id="s-tiktokUrl" value="${s.tiktokUrl || ""}" /></div>
      </div>

      <div class="panel" style="max-width:640px; margin-bottom:20px;">
        <h2>طرق الدفع الاختيارية</h2>
        <div class="field">
          <label><input type="checkbox" id="s-vodafoneCashEnabled" ${s.vodafoneCashEnabled ? "checked" : ""} style="width:auto;" /> تفعيل فودافون كاش</label>
        </div>
        <div class="field"><label>رقم فودافون كاش</label><input id="s-vodafoneCashNumber" value="${s.vodafoneCashNumber || ""}" /></div>
        <div class="field">
          <label><input type="checkbox" id="s-instapayEnabled" ${s.instapayEnabled ? "checked" : ""} style="width:auto;" /> تفعيل إنستا باي</label>
        </div>
        <div class="field"><label>رقم / يوزر إنستا باي</label><input id="s-instapayNumber" value="${s.instapayNumber || ""}" /></div>
      </div>

      <div class="panel" style="max-width:640px; margin-bottom:20px;">
        <h2>بيكسل ميتا وجوجل أناليتكس وكود الهيدر</h2>
        <div class="field"><label>Meta Pixel ID</label><input id="s-metaPixelId" value="${s.metaPixelId || ""}" placeholder="مثال: 1234567890" /></div>
        <div class="field"><label>Google Analytics ID</label><input id="s-gaId" value="${s.gaId || ""}" placeholder="مثال: G-XXXXXXX" /></div>
        <div class="field"><label>كود هيدر مخصص (أي كود HTML/JS إضافي)</label><textarea id="s-customHeadCode" style="min-height:80px; font-family:monospace; direction:ltr; text-align:left;">${s.customHeadCode || ""}</textarea></div>
      </div>

      <button class="btn btn-primary" style="width:auto; padding:12px 28px;" id="save-settings-btn">حفظ كل الإعدادات</button>
    `;

    document.getElementById("s-logo-input").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const progressBox = document.getElementById("s-logo-progress");
      progressBox.textContent = "جارِ رفع اللوجو...";
      try {
        const res = await uploadToCloudinary(file, (pct) => { progressBox.textContent = `جارِ رفع اللوجو... ${pct}%`; });
        document.getElementById("s-logoUrl").value = res.url;
        const preview = document.getElementById("s-logo-preview");
        preview.src = res.url;
        preview.style.display = "block";
      } catch (err) {
        alert("فشل رفع اللوجو: " + err.message);
      }
      progressBox.textContent = "";
      e.target.value = "";
    });

    document.getElementById("save-settings-btn").onclick = async () => {
      const payload = {
        storeName: val("s-storeName"),
        logoUrl: val("s-logoUrl"),
        seoTitle: val("s-seoTitle"),
        seoDescription: val("s-seoDescription"),
        primaryColor: val("s-primaryColor"),
        accentColor: val("s-accentColor"),
        heroTitle: val("s-heroTitle"),
        heroSubtitle: val("s-heroSubtitle"),
        aboutText: val("s-aboutText"),
        shippingPolicyText: val("s-shippingPolicyText"),
        whatsappNumber: val("s-whatsappNumber"),
        secondaryPhoneEnabled: document.getElementById("s-secondaryPhoneEnabled").checked,
        facebookUrl: val("s-facebookUrl"),
        instagramUrl: val("s-instagramUrl"),
        tiktokUrl: val("s-tiktokUrl"),
        vodafoneCashEnabled: document.getElementById("s-vodafoneCashEnabled").checked,
        vodafoneCashNumber: val("s-vodafoneCashNumber"),
        instapayEnabled: document.getElementById("s-instapayEnabled").checked,
        instapayNumber: val("s-instapayNumber"),
        metaPixelId: val("s-metaPixelId"),
        gaId: val("s-gaId"),
        customHeadCode: val("s-customHeadCode")
      };
      await db.collection("settings").doc("general").set(payload, { merge: true });
      clearSettingsCache();
      alert("تم حفظ الإعدادات بنجاح");
    };
  }

  function val(id) { return document.getElementById(id).value.trim(); }

  /* ================= Boot ================= */
  if (!IS_CONFIGURED) {
    document.getElementById("app-root").innerHTML = `<p class="empty" style="padding:80px 20px;">وصّل Firebase الأول عشان تقدر تدخل لوحة التحكم (راجع shared.js وREADME.md).</p>`;
  } else {
    auth.onAuthStateChanged((user) => { if (user) renderShell(); else renderLogin(); });
  }
</script>
</body>
</html>
