<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تفاصيل المنتج — متجري</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>

<main id="product-root">
  <p class="empty">جارِ تحميل بيانات المنتج...</p>
</main>

<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const productId = params.get("id");
  let currentProduct = null;
  let selectedColor = "";
  let selectedSize = "";
  let activeMediaIndex = 0;
  let autoSlideTimer = null;

  init();

  async function init() {
    await bootPage();
    loadProduct();
  }

  async function loadProduct() {
    const root = document.getElementById("product-root");
    if (!IS_CONFIGURED) {
      root.innerHTML = `<p class="empty">وصّل Firebase الأول عشان تظهر بيانات المنتج.</p>`;
      return;
    }
    if (!productId) {
      root.innerHTML = `<p class="empty">المنتج غير موجود.</p>`;
      return;
    }
    try {
      const doc = await db.collection("products").doc(productId).get();
      if (!doc.exists) {
        root.innerHTML = `<p class="empty">المنتج ده مش موجود أو اتشال.</p>`;
        return;
      }
      currentProduct = { id: doc.id, ...doc.data() };
      if (!currentProduct.images) currentProduct.images = currentProduct.image ? [currentProduct.image] : [];
      selectedColor = firstInStock(currentProduct.colors, currentProduct.colorsStock);
      selectedSize = firstInStock(currentProduct.sizes, currentProduct.sizesStock);
      renderProduct();
      const settings = await getSettings();
      applySEO(settings, currentProduct.name + " — " + (settings.storeName || "متجري"), currentProduct.description);
      trackPixelEvent("ViewContent", { value: currentProduct.price, currency: "EGP" });
    } catch (e) {
      root.innerHTML = `<p class="empty">حصل خطأ أثناء التحميل.<br><small>${e.message}</small></p>`;
    }
  }

  function firstInStock(list, stockMap) {
    if (!list || !list.length) return "";
    const available = list.find((v) => !stockMap || stockMap[v] == null || stockMap[v] > 0);
    return available || list[0];
  }

  function mediaList() {
    const p = currentProduct;
    const list = (p.images || []).map((url) => ({ type: "image", url }));
    if (p.video) list.push({ type: "video", url: p.video });
    return list;
  }

  /* هل الاختيار الحالي (لون/مقاس) متاح ومخزونه أكبر من صفر؟ */
  function isAvailable() {
    const p = currentProduct;
    if (p.colors && p.colors.length && p.colorsStock && selectedColor) {
      if ((p.colorsStock[selectedColor] ?? 1) <= 0) return false;
    }
    if (p.sizes && p.sizes.length && p.sizesStock && selectedSize) {
      if ((p.sizesStock[selectedSize] ?? 1) <= 0) return false;
    }
    if ((!p.colors || !p.colors.length) && (!p.sizes || !p.sizes.length) && p.stock != null) {
      if (p.stock <= 0) return false;
    }
    return true;
  }

  function stockBadgeHtml() {
    const p = currentProduct;
    if ((!p.colors || !p.colors.length) && (!p.sizes || !p.sizes.length) && p.stock != null) {
      if (p.stock <= 0) return `<span class="stock-badge out">${t("out_of_stock")}</span>`;
      if (p.stock <= 5) return `<span class="stock-badge low">${t("low_stock")} (${p.stock})</span>`;
      return `<span class="stock-badge ok">متوفر (${p.stock})</span>`;
    }
    return "";
  }

  function renderProduct() {
    const p = currentProduct;
    const media = mediaList();
    const activeMedia = media[activeMediaIndex] || { type: "image", url: "" };
    const available = isAvailable();

    document.getElementById("product-root").innerHTML = `
      <div class="product-view">
        <div>
          <div class="product-img">
            ${
              media.length === 0
                ? `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:60px;">🛍️</div>`
                : activeMedia.type === "video"
                ? `<video src="${activeMedia.url}" controls playsinline style="width:100%;height:100%;object-fit:cover;"></video>`
                : `<img src="${activeMedia.url}" alt="${p.name}">`
            }
          </div>
          ${
            media.length > 1
              ? `<div class="thumb-row">
                  ${media
                    .map(
                      (m, idx) => `
                    <button type="button" class="thumb-btn ${idx === activeMediaIndex ? "active" : ""}" onclick="setActiveMedia(${idx})">
                      ${m.type === "video" ? `<span class="thumb-play">▶</span><video src="${m.url}" muted></video>` : `<img src="${m.url}">`}
                    </button>
                  `
                    )
                    .join("")}
                </div>`
              : ""
          }
        </div>
        <div class="product-info">
          ${p.category ? `<span class="chip active" style="display:inline-block;margin-bottom:10px;">${p.category}</span>` : ""}
          <h1>${p.name}</h1>
          <span class="price">${formatPrice(p.price)} ${p.oldPrice ? `<span class="price old">${formatPrice(p.oldPrice)}</span>` : ""}</span>
          <div>${stockBadgeHtml()}</div>
          ${
            p.qtyDiscountThreshold
              ? `<p style="color:var(--brand-dark); font-weight:700; font-size:14px; margin:8px 0;">🎁 اشترِ ${p.qtyDiscountThreshold} قطع أو أكتر واحصل على خصم ${p.qtyDiscountPercent}%</p>`
              : ""
          }
          ${
            p.pdfUrl
              ? `<p style="background:var(--brand-light); color:var(--brand-dark); padding:8px 12px; border-radius:8px; font-size:13px; font-weight:700;">📄 ده كتاب/ملف رقمي (PDF) — هيوصلك رابط التحميل بعد تأكيد الطلب</p>`
              : ""
          }
          <p class="product-desc">${p.description || "لا يوجد وصف لهذا المنتج."}</p>

          ${
            p.colors && p.colors.length
              ? `<div class="field">
                  <label data-i18n="color">اللون</label>
                  <div class="variant-row" id="color-row">
                    ${p.colors
                      .map((c) => {
                        const stock = p.colorsStock ? p.colorsStock[c] : null;
                        const out = stock != null && stock <= 0;
                        return `<button type="button" class="variant-btn ${c === selectedColor ? "active" : ""} ${out ? "out-of-stock" : ""}" data-color="${c}" ${out ? "disabled" : ""}>${c}${out ? ` (${t("out_of_stock")})` : ""}</button>`;
                      })
                      .join("")}
                  </div>
                </div>`
              : ""
          }
          ${
            p.sizes && p.sizes.length
              ? `<div class="field">
                  <label data-i18n="size">المقاس</label>
                  <div class="variant-row" id="size-row">
                    ${p.sizes
                      .map((s) => {
                        const stock = p.sizesStock ? p.sizesStock[s] : null;
                        const out = stock != null && stock <= 0;
                        return `<button type="button" class="variant-btn ${s === selectedSize ? "active" : ""} ${out ? "out-of-stock" : ""}" data-size="${s}" ${out ? "disabled" : ""}>${s}${out ? ` (${t("out_of_stock")})` : ""}</button>`;
                      })
                      .join("")}
                  </div>
                </div>`
              : ""
          }

          <div class="qty-row">
            <span style="font-weight:700;" data-i18n="quantity">الكمية</span>
            <div class="qty-box">
              <button id="qty-minus" type="button">−</button>
              <input id="qty-input" type="number" value="1" min="1" />
              <button id="qty-plus" type="button">+</button>
            </div>
          </div>

          <div style="display:flex; gap:12px;">
            <button class="btn btn-outline" id="add-cart-btn" data-i18n="add_to_cart" ${available ? "" : "disabled"}>أضف للسلة</button>
            <button class="btn btn-primary" id="order-now-btn" data-i18n="order_now" ${available ? "" : "disabled"}>اطلب الآن</button>
          </div>
        </div>
      </div>
    `;
    applyLanguage();

    document.getElementById("qty-minus").onclick = () => stepQty(-1);
    document.getElementById("qty-plus").onclick = () => stepQty(1);
    document.getElementById("qty-input").addEventListener("change", clampQty);
    document.getElementById("add-cart-btn").onclick = () => {
      if (!isAvailable()) return;
      addToCart(p, getQty(), { color: selectedColor, size: selectedSize });
    };
    document.getElementById("order-now-btn").onclick = () => {
      if (!isAvailable()) return;
      addToCart(p, getQty(), { color: selectedColor, size: selectedSize });
      location.href = "checkout.html";
    };

    const colorRow = document.getElementById("color-row");
    if (colorRow) {
      colorRow.querySelectorAll(".variant-btn:not([disabled])").forEach((btn) => {
        btn.addEventListener("click", () => { selectedColor = btn.dataset.color; renderProduct(); });
      });
    }
    const sizeRow = document.getElementById("size-row");
    if (sizeRow) {
      sizeRow.querySelectorAll(".variant-btn:not([disabled])").forEach((btn) => {
        btn.addEventListener("click", () => { selectedSize = btn.dataset.size; renderProduct(); });
      });
    }

    scheduleAutoSlide();
  }

  window.setActiveMedia = (idx) => { activeMediaIndex = idx; renderProduct(); };

  function scheduleAutoSlide() {
    clearInterval(autoSlideTimer);
    const imgCount = (currentProduct.images || []).length;
    if (imgCount > 1) {
      autoSlideTimer = setInterval(() => {
        activeMediaIndex = (activeMediaIndex + 1) % imgCount;
        renderProduct();
      }, 4000);
    }
  }

  function getQty() { return Math.max(1, parseInt(document.getElementById("qty-input").value) || 1); }
  function clampQty() {
    const input = document.getElementById("qty-input");
    let val = Math.max(1, parseInt(input.value) || 1);
    const max = currentProduct.maxQtyPerOrder;
    if (max && val > max) {
      val = max;
      alert(`أقصى كمية للطلب الواحد ${max} قطع للعميل الواحد`);
    }
    input.value = val;
  }
  function stepQty(delta) {
    const input = document.getElementById("qty-input");
    input.value = Math.max(1, (parseInt(input.value) || 1) + delta);
    clampQty();
  }
</script>
</body>
</html>
