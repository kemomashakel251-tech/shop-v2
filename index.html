<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>متجري — تسوق أونلاين</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>

<section class="hero" id="hero-section">
  <h1 id="hero-title">كل اللي محتاجه في مكان واحد</h1>
  <p id="hero-subtitle">اطلب أونلاين واستلم في بيتك — دفع عند الاستلام</p>
</section>

<div class="categories" id="categories"></div>

<main>
  <div class="grid" id="product-grid">
    <p class="empty">جارِ تحميل المنتجات...</p>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
  let allProducts = [];
  let activeCategory = "الكل";

  init();

  async function init() {
    const settings = await bootPage();
    if (settings.heroTitle) document.getElementById("hero-title").textContent = settings.heroTitle;
    if (settings.heroSubtitle) document.getElementById("hero-subtitle").textContent = settings.heroSubtitle;
    loadProducts();
  }

  async function loadProducts() {
    const grid = document.getElementById("product-grid");
    if (!IS_CONFIGURED) {
      grid.innerHTML = `<p class="empty">وصّل Firebase الأول عشان تظهر المنتجات هنا (راجع shared.js وREADME.md).</p>`;
      return;
    }
    try {
      allProducts = await getProductsCached((fresh) => {
        allProducts = fresh;
        renderCategories();
        renderGrid();
      });
      renderCategories();
      renderGrid();
    } catch (e) {
      grid.innerHTML = `<p class="empty">تعذّر تحميل المنتجات. تأكد من إعدادات Firestore.<br><small>${e.message}</small></p>`;
    }
  }

  function renderCategories() {
    const cats = ["الكل", ...new Set(allProducts.map((p) => p.category).filter(Boolean))];
    const wrap = document.getElementById("categories");
    wrap.innerHTML = cats
      .map((c) => `<button class="chip ${c === activeCategory ? "active" : ""}" data-cat="${c}">${c}</button>`)
      .join("");
    wrap.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        renderCategories();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const grid = document.getElementById("product-grid");
    const list = activeCategory === "الكل" ? allProducts : allProducts.filter((p) => p.category === activeCategory);

    if (list.length === 0) {
      grid.innerHTML = `<p class="empty">لا توجد منتجات حاليًا في هذا القسم.</p>`;
      return;
    }

    grid.innerHTML = list
      .map(
        (p) => `
      <a class="card" href="product.html?id=${p.id}">
        <div class="card-img">
          ${(p.images && p.images[0]) || p.image ? `<img src="${(p.images && p.images[0]) || p.image}" alt="${p.name}">` : "🛍️"}
        </div>
        <div class="card-body">
          <p class="card-name">${p.name}</p>
          <span class="price">${formatPrice(p.price)}</span>
          ${p.oldPrice ? `<span class="price old">${formatPrice(p.oldPrice)}</span>` : ""}
        </div>
      </a>
    `
      )
      .join("");
  }
</script>
</body>
</html>
