<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إتمام الطلب — متجري</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>

<main id="checkout-root"></main>

<footer id="site-footer"></footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
  let shippingRates = { cities: {}, default: 0 };
  let storeSettings = {};
  let appliedCoupon = null;
  let selectedPayment = "cod";

  init();

  async function init() {
    storeSettings = await bootPage({ title: "إتمام الطلب" });
    shippingRates = await getShippingRates();
    renderCheckout();
  }

  function currentShippingFee() {
    const cityInput = document.getElementById("city-input");
    return cityInput ? getShippingFee(shippingRates, cityInput.value) : 0;
  }

  function renderCheckout() {
    const cart = getCart();
    const root = document.getElementById("checkout-root");

    if (cart.length === 0) {
      root.innerHTML = `
        <div class="empty" style="padding:80px 20px;">
          <p style="font-size:18px; font-weight:700; margin-bottom:16px;" data-i18n="empty_cart">السلة فاضية دلوقتي</p>
          <a href="index.html" class="btn btn-primary" style="display:inline-block; width:auto; padding:12px 28px;" data-i18n="browse_products">تصفح المنتجات</a>
        </div>`;
      applyLanguage();
      return;
    }

    const paymentOptions = [{ id: "cod", label: t("cod"), instructions: "" }];
    if (storeSettings.vodafoneCashEnabled) {
      paymentOptions.push({
        id: "vodafone",
        label: "فودافون كاش",
        instructions: `حوّل قيمة الطلب على رقم ${storeSettings.vodafoneCashNumber || "—"} واكتب رقم العملية في الملاحظات`
      });
    }
    if (storeSettings.instapayEnabled) {
      paymentOptions.push({
        id: "instapay",
        label: "إنستا باي",
        instructions: `حوّل قيمة الطلب على ${storeSettings.instapayNumber || "—"} واكتب رقم العملية في الملاحظات`
      });
    }

    root.innerHTML = `
      <div class="checkout-wrap">
        <div class="panel">
          <h2 data-i18n="checkout_title">بيانات الطلب</h2>
          <form id="order-form">
            <div class="field">
              <label data-i18n="full_name">الاسم بالكامل</label>
              <input type="text" name="name" required placeholder="مثال: أحمد محمد" />
            </div>
            <div class="field">
              <label data-i18n="phone">رقم الموبايل</label>
              <input type="tel" name="phone" required pattern="[0-9]{10,15}" placeholder="01xxxxxxxxx" />
            </div>
            ${
              storeSettings.secondaryPhoneEnabled
                ? `<div class="field">
                    <label>رقم هاتف آخر (اختياري)</label>
                    <input type="tel" name="phone2" pattern="[0-9]{10,15}" placeholder="01xxxxxxxxx" />
                  </div>`
                : ""
            }
            <div class="field">
              <label data-i18n="city">المحافظة</label>
              <input type="text" name="city" id="city-input" required placeholder="مثال: القاهرة" list="city-list" />
              <datalist id="city-list">
                ${Object.keys(shippingRates.cities || {}).map((c) => `<option value="${c}">`).join("")}
              </datalist>
            </div>
            <div class="field">
              <label data-i18n="address">العنوان بالتفصيل</label>
              <textarea name="address" required placeholder="الحي، الشارع، رقم العقار..."></textarea>
            </div>

            <div class="field">
              <label data-i18n="payment_method">طريقة الدفع</label>
              <div class="payment-options" id="payment-options">
                ${paymentOptions
                  .map(
                    (opt) => `
                  <label class="payment-option ${opt.id === selectedPayment ? "active" : ""}" data-id="${opt.id}">
                    <input type="radio" name="payment" value="${opt.id}" ${opt.id === selectedPayment ? "checked" : ""} style="width:auto;" />
                    ${opt.label}
                  </label>
                `
                  )
                  .join("")}
              </div>
              <div id="payment-instructions"></div>
            </div>

            <div class="field">
              <label data-i18n="coupon_code">كود الخصم (اختياري)</label>
              <div style="display:flex; gap:8px;">
                <input type="text" id="coupon-input" placeholder="اكتب الكود هنا" />
                <button type="button" class="btn btn-outline" style="width:auto; padding:0 18px;" id="apply-coupon-btn" data-i18n="apply">تطبيق</button>
              </div>
              <p id="coupon-msg" style="font-size:13px; margin-top:6px;"></p>
            </div>

            <div class="field">
              <label data-i18n="notes">ملاحظات (اختياري)</label>
              <textarea name="notes" id="notes-input" placeholder="أي تفاصيل إضافية عن الطلب"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn" data-i18n="confirm_order">تأكيد الطلب</button>
          </form>
        </div>

        <div class="panel">
          <h2 data-i18n="order_summary">ملخص الطلب</h2>
          <div id="cart-lines"></div>
          <div class="total-row" style="font-size:15px; font-weight:700; border-top:none; padding-top:0;">
            <span data-i18n="subtotal">المنتجات</span><span id="cart-subtotal">${formatPrice(cartSubtotal())}</span>
          </div>
          <div class="total-row" style="font-size:15px; font-weight:700; border-top:none; padding-top:0;">
            <span data-i18n="shipping">الشحن</span><span id="cart-shipping">—</span>
          </div>
          <div class="total-row" id="discount-row" style="font-size:15px; font-weight:700; border-top:none; padding-top:0; display:none; color:#c0392b;">
            <span data-i18n="discount">الخصم</span><span id="cart-discount"></span>
          </div>
          <div class="total-row">
            <span data-i18n="total">الإجمالي</span>
            <span id="cart-total">${formatPrice(cartSubtotal())}</span>
          </div>
        </div>
      </div>
    `;

    renderCartLines();
    document.getElementById("order-form").addEventListener("submit", submitOrder);
    document.getElementById("city-input").addEventListener("input", updateTotals);

    document.querySelectorAll(".payment-option").forEach((label) => {
      label.addEventListener("click", () => {
        selectedPayment = label.dataset.id;
        document.querySelectorAll(".payment-option").forEach((l) => l.classList.toggle("active", l.dataset.id === selectedPayment));
        renderPaymentInstructions(paymentOptions);
      });
    });
    renderPaymentInstructions(paymentOptions);

    document.getElementById("apply-coupon-btn").addEventListener("click", async () => {
      const code = document.getElementById("coupon-input").value.trim();
      const msg = document.getElementById("coupon-msg");
      if (!code) return;
      msg.textContent = "جارِ التحقق...";
      const coupon = await validateCoupon(code);
      if (!coupon) {
        appliedCoupon = null;
        msg.style.color = "#c0392b";
        msg.textContent = "الكود غير صحيح أو منتهي";
      } else {
        appliedCoupon = coupon;
        msg.style.color = "var(--brand-dark)";
        msg.textContent = "تم تطبيق الكوبون بنجاح ✓";
      }
      updateTotals();
    });

    updateTotals();
    applyLanguage();
  }

  function renderPaymentInstructions(paymentOptions) {
    const opt = paymentOptions.find((o) => o.id === selectedPayment);
    document.getElementById("payment-instructions").innerHTML = opt && opt.instructions
      ? `<div class="payment-instructions">${opt.instructions}</div>` : "";
  }

  function updateTotals() {
    const subtotal = cartSubtotal();
    const shipping = currentShippingFee();
    const discount = appliedCoupon ? applyCouponToTotal(subtotal, appliedCoupon) : 0;

    document.getElementById("cart-subtotal").textContent = formatPrice(subtotal);
    document.getElementById("cart-shipping").textContent = formatPrice(shipping);
    const discountRow = document.getElementById("discount-row");
    if (discount > 0) {
      discountRow.style.display = "flex";
      document.getElementById("cart-discount").textContent = "-" + formatPrice(discount);
    } else {
      discountRow.style.display = "none";
    }
    document.getElementById("cart-total").textContent = formatPrice(Math.max(0, subtotal + shipping - discount));
  }

  function renderCartLines() {
    const cart = getCart();
    const wrap = document.getElementById("cart-lines");
    wrap.innerHTML = cart
      .map((i) => {
        const variant = [i.color, i.size].filter(Boolean).join(" / ");
        const eff = lineEffectivePrice(i);
        return `
      <div class="cart-line">
        <img src="${i.image || ""}" onerror="this.style.display='none'" />
        <div class="cart-line-info">
          <p class="cart-line-name">${i.name}${variant ? ` <span style="color:var(--text-muted); font-weight:500;">(${variant})</span>` : ""}</p>
          <p class="cart-line-qty">${formatPrice(eff)} × ${i.qty} ${eff < i.price ? `<span style="color:var(--brand-dark);">(خصم كمية)</span>` : ""}</p>
        </div>
        <button class="remove-btn" onclick="removeLine('${i.lineId}')">حذف</button>
      </div>
    `;
      })
      .join("");
  }

  function removeLine(lineId) {
    removeFromCart(lineId);
    renderCheckout();
  }

  async function submitOrder(e) {
    e.preventDefault();
    if (!IS_CONFIGURED) {
      alert("وصّل Firebase الأول عشان تقدر تستقبل الطلبات (راجع shared.js).");
      return;
    }
    const form = e.target;
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "جارِ إرسال الطلب...";

    const city = form.city.value.trim();
    const shipping = getShippingFee(shippingRates, city);
    const subtotal = cartSubtotal();
    const discount = appliedCoupon ? applyCouponToTotal(subtotal, appliedCoupon) : 0;
    const paymentLabels = { cod: "الدفع عند الاستلام", vodafone: "فودافون كاش", instapay: "إنستا باي" };

    const order = {
      customerName: form.name.value.trim(),
      phone: form.phone.value.trim(),
      phone2: form.phone2 ? form.phone2.value.trim() : "",
      city: city,
      address: form.address.value.trim(),
      notes: form.notes.value.trim(),
      items: getCart(),
      subtotal: subtotal,
      shipping: shipping,
      discount: discount,
      couponCode: appliedCoupon ? appliedCoupon.code : null,
      paymentMethod: paymentLabels[selectedPayment] || "الدفع عند الاستلام",
      total: Math.max(0, subtotal + shipping - discount),
      status: "جديد",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      await db.collection("orders").add(order);
      trackPixelEvent("Purchase", { value: order.total, currency: "EGP" });
      decrementStock(order);
      const waLink = buildWhatsAppOrderLink(order, storeSettings.whatsappNumber || "");
      const pdfLinks = order.items.filter((i) => i.pdfUrl).map((i) => ({ name: i.name, url: i.pdfUrl }));
      clearCart();
      showSuccess(waLink, storeSettings.whatsappNumber, pdfLinks);
    } catch (err) {
      alert("حصل خطأ أثناء إرسال الطلب: " + err.message);
      btn.disabled = false;
      btn.textContent = "تأكيد الطلب";
    }
  }

  function showSuccess(waLink, whatsappNumber, pdfLinks) {
    document.getElementById("checkout-root").innerHTML = `
      <div class="success-box">
        <div class="check">✓</div>
        <h2 data-i18n="order_success">تم استلام طلبك بنجاح!</h2>
        <p style="color:var(--text-muted); margin-bottom:24px;">هيتم التواصل معاك قريب لتأكيد الطلب والتوصيل.</p>
        ${
          pdfLinks && pdfLinks.length
            ? `<div class="panel" style="max-width:420px; margin:0 auto 20px; text-align:right;">
                <h2 style="margin-top:0; font-size:16px;">📄 ملفاتك جاهزة للتحميل</h2>
                ${pdfLinks.map((l) => `<a href="${l.url}" target="_blank" class="btn btn-outline" style="display:block; margin-bottom:8px;">تحميل: ${l.name}</a>`).join("")}
              </div>`
            : ""
        }
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
          ${whatsappNumber ? `<a href="${waLink}" target="_blank" class="btn btn-primary" style="display:inline-block; width:auto; padding:12px 28px; background:#25D366;">أرسل تفاصيل الطلب على واتساب</a>` : ""}
          <a href="index.html" class="btn btn-outline" style="display:inline-block; width:auto; padding:12px 28px;" data-i18n="continue_shopping">تابع التسوق</a>
        </div>
      </div>
    `;
    applyLanguage();
  }
</script>
</body>
</html>
