<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إتمام الطلب — متجري</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header id="site-header"></header>

<main id="checkout-root"></main>

<footer>© <span id="year"></span> متجري — جميع الحقوق محفوظة</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  renderHeader("متجري");
  renderCheckout();

  function renderCheckout() {
    const cart = getCart();
    const root = document.getElementById("checkout-root");

    if (cart.length === 0) {
      root.innerHTML = `
        <div class="empty" style="padding:80px 20px;">
          <p style="font-size:18px; font-weight:700; margin-bottom:16px;">السلة فاضية دلوقتي</p>
          <a href="index.html" class="btn btn-primary" style="display:inline-block; width:auto; padding:12px 28px;">تصفح المنتجات</a>
        </div>`;
      return;
    }

    root.innerHTML = `
      <div class="checkout-wrap">
        <div class="panel">
          <h2>بيانات الطلب</h2>
          <form id="order-form">
            <div class="field">
              <label>الاسم بالكامل</label>
              <input type="text" name="name" required placeholder="مثال: أحمد محمد" />
            </div>
            <div class="field">
              <label>رقم الموبايل</label>
              <input type="tel" name="phone" required pattern="[0-9]{10,15}" placeholder="01xxxxxxxxx" />
            </div>
            <div class="field">
              <label>المحافظة</label>
              <input type="text" name="city" required placeholder="مثال: القاهرة" />
            </div>
            <div class="field">
              <label>العنوان بالتفصيل</label>
              <textarea name="address" required placeholder="الحي، الشارع، رقم العقار..."></textarea>
            </div>
            <div class="field">
              <label>ملاحظات (اختياري)</label>
              <textarea name="notes" placeholder="أي تفاصيل إضافية عن الطلب"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="submit-btn">تأكيد الطلب — الدفع عند الاستلام</button>
          </form>
        </div>

        <div class="panel">
          <h2>ملخص الطلب</h2>
          <div id="cart-lines"></div>
          <div class="total-row">
            <span>الإجمالي</span>
            <span id="cart-total">${formatPrice(cartTotal())}</span>
          </div>
        </div>
      </div>
    `;

    renderCartLines();
    document.getElementById("order-form").addEventListener("submit", submitOrder);
  }

  function renderCartLines() {
    const cart = getCart();
    const wrap = document.getElementById("cart-lines");
    wrap.innerHTML = cart
      .map(
        (i) => `
      <div class="cart-line">
        <img src="${i.image || ""}" onerror="this.style.display='none'" />
        <div class="cart-line-info">
          <p class="cart-line-name">${i.name}</p>
          <p class="cart-line-qty">${formatPrice(i.price)} × ${i.qty}</p>
        </div>
        <button class="remove-btn" onclick="removeLine('${i.id}')">حذف</button>
      </div>
    `
      )
      .join("");
  }

  function removeLine(id) {
    removeFromCart(id);
    renderCheckout();
  }

  async function submitOrder(e) {
    e.preventDefault();
    if (!IS_CONFIGURED) {
      alert("وصّل Firebase الأول عشان تقدر تستقبل الطلبات (راجع shared.js).");
      return;
    }
    const form = e.target;
    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "جارِ إرسال الطلب...";

    const order = {
      customerName: form.name.value.trim(),
      phone: form.phone.value.trim(),
      city: form.city.value.trim(),
      address: form.address.value.trim(),
      notes: form.notes.value.trim(),
      items: getCart(),
      total: cartTotal(),
      status: "جديد",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      await db.collection("orders").add(order);
      clearCart();
      showSuccess();
    } catch (err) {
      alert("حصل خطأ أثناء إرسال الطلب: " + err.message);
      btn.disabled = false;
      btn.textContent = "تأكيد الطلب — الدفع عند الاستلام";
    }
  }

  function showSuccess() {
    document.getElementById("checkout-root").innerHTML = `
      <div class="success-box">
        <div class="check">✓</div>
        <h2>تم استلام طلبك بنجاح!</h2>
        <p style="color:var(--text-muted); margin-bottom:24px;">هيتم التواصل معاك قريب لتأكيد الطلب والتوصيل.</p>
        <a href="index.html" class="btn btn-primary" style="display:inline-block; width:auto; padding:12px 28px;">تابع التسوق</a>
      </div>
    `;
  }
</script>
</body>
</html>
